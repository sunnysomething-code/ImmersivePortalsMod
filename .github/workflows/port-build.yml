name: Port Build

on:
  push:
    branches:
      - 26.1.2-port
  pull_request:
    branches:
      - 1.21
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Resolve and inspect Minecraft 26.1.2 classes
        run: |
          ./gradlew printClasspath > /tmp/classpath.txt
          cat /tmp/classpath.txt
          python3 - <<'PY'
          import os, re, subprocess
          text = open('/tmp/classpath.txt', errors='ignore').read()
          jars = re.findall(r'"([^"\n]+\.jar)"', text)
          needles = re.compile(r'(ResourceLocation|Identifier|GuiGraphics|GuiGraphicsExtractor|Util\.class|AbstractMinecart|Minecart|FogRenderer|RenderType|LightTexture|InteractionResultHolder|ChunkProgressListener|DimensionDataStorage|RelativeMovement|AbstractArrow|ThrownEnderpearl|EndDragonFight|GlDebug|ProcessorMailbox|ChunkTaskPriorityQueueSorter|WeightedRandomList)')
          for jar in jars:
              if not os.path.exists(jar):
                  continue
              try:
                  out = subprocess.check_output(['jar','tf',jar], text=True, stderr=subprocess.DEVNULL)
              except Exception:
                  continue
              matches = [line for line in out.splitlines() if needles.search(line)]
              if matches:
                  print('===', jar, '===')
                  print('\n'.join(matches[:400]))
          PY

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/libs/**
            build/reports/**
          if-no-files-found: ignore
