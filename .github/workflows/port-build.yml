name: Port Build

on:
  push:
    branches:
      - 26.1.2-port
  workflow_dispatch:

concurrency:
  group: port-26.1.2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 26.1.2-port

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Import upstream 1.21.3 renderer migration if needed
        run: |
          if [ ! -f .port-1.21.3-imported ]; then
            bash scripts/import_upstream_1_21_3.sh
          fi

      - name: Apply verified mechanical 26.1.2 renames
        run: python3 scripts/port_26_1_mechanical.py

      - name: Build and capture compiler output
        id: build
        shell: bash
        run: |
          set +e
          ./gradlew build --stacktrace --console=plain 2>&1 | tee compile.log
          status=${PIPESTATUS[0]}
          grep -n -E 'error:|cannot find symbol|package .* does not exist|FAILURE:|What went wrong|Execution failed' compile.log | head -n 500 > compile-errors.txt || true
          echo "Gradle exit status: $status" >> compile-errors.txt
          exit $status

      - name: Print condensed compiler errors
        if: failure()
        run: cat compile-errors.txt || true

      - name: Upload build and compiler artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            compile.log
            compile-errors.txt
            build/libs/**
            build/reports/**
          if-no-files-found: ignore
