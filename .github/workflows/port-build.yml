name: Port Build

on:
  push:
    branches:
      - 26.1.2-port
  pull_request:
    branches:
      - 1.21
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 26.1.2-port

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Import upstream 1.21.3 renderer migration if needed
        run: |
          if [ ! -f .port-1.21.3-imported ]; then
            bash scripts/import_upstream_1_21_3.sh
          fi

      - name: Apply verified mechanical 26.1.2 renames
        run: python3 scripts/port_26_1_mechanical.py

      - name: Probe Minecraft and Fabric 26.1.2 APIs
        run: |
          ./gradlew printClasspath > /tmp/classpath.txt
          python3 - <<'PY'
          import os, re, subprocess
          text = open('/tmp/classpath.txt', errors='ignore').read()
          jars = [p for p in re.findall(r'\"([^\"\n]+\.jar)\"', text) if os.path.exists(p)]
          cp = os.pathsep.join(jars)
          mc = None
          for jar in jars:
              try:
                  listing = subprocess.check_output(['jar','tf',jar], text=True, stderr=subprocess.DEVNULL)
              except Exception:
                  continue
              if 'net/minecraft/world/item/Item.class' in listing:
                  mc = jar
                  break
          print('MINECRAFT_JAR=', mc)
          if not mc:
              raise SystemExit(0)
          classes = [
              'net.minecraft.server.MinecraftServer',
              'net.minecraft.server.level.Ticket',
              'net.minecraft.server.level.TicketType',
              'net.minecraft.server.level.DistanceManager',
              'net.minecraft.server.level.ChunkTaskDispatcher',
              'net.minecraft.server.level.ThrottlingChunkTaskDispatcher',
              'net.minecraft.world.level.TicketStorage',
              'net.minecraft.server.level.ServerLevel',
              'net.minecraft.client.gui.GuiGraphicsExtractor',
              'net.minecraft.client.renderer.Lightmap',
              'net.minecraft.client.renderer.LevelRenderer',
              'net.minecraft.client.renderer.GameRenderer',
              'net.minecraft.client.particle.ParticleEngine',
              'net.minecraft.client.Options',
              'net.minecraft.client.renderer.RenderPipelines',
              'com.mojang.blaze3d.systems.RenderSystem',
              'com.mojang.blaze3d.opengl.GlProgram',
              'com.mojang.blaze3d.pipeline.CompiledRenderPipeline',
              'net.fabricmc.fabric.api.creativetab.v1.FabricCreativeModeTab',
              'net.fabricmc.fabric.api.block.v1.FabricBlock',
              'net.fabricmc.fabric.api.client.command.v2.ClientCommands',
          ]
          for cls in classes:
              print('\n##### JAVAP', cls, '#####')
              subprocess.run(['javap','-classpath',cp,'-p',cls], check=False)
          print('\n##### RELEVANT CLASSES #####')
          listing = subprocess.check_output(['jar','tf',mc], text=True)
          pat = re.compile(r'(ChunkProgress|GuiGraphics|TicketStorage|TeleportTransition|Lightmap|Fog|VertexBuffer|GraphicsMode|RenderPipeline|LevelLoadingScreen|ParticleEngine)')
          for line in listing.splitlines():
              if pat.search(line):
                  print(line)
          PY

      - name: Build and capture compiler output
        id: build
        shell: bash
        run: |
          set +e
          ./gradlew build --stacktrace --console=plain 2>&1 | tee compile.log
          status=${PIPESTATUS[0]}
          grep -n -E 'error:|cannot find symbol|package .* does not exist|FAILURE:|What went wrong|Execution failed' compile.log | head -n 500 > compile-errors.txt || true
          echo "Gradle exit status: $status" >> compile-errors.txt
          exit $status

      - name: Print condensed compiler errors
        if: failure()
        run: cat compile-errors.txt || true

      - name: Upload build and compiler artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            compile.log
            compile-errors.txt
            build/libs/**
            build/reports/**
          if-no-files-found: ignore
