name: Port Build

on:
  push:
    branches:
      - 26.1.2-port
  pull_request:
    branches:
      - 1.21
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 26.1.2-port

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Import upstream 1.21.3 renderer migration once
        run: |
          if [ ! -f .port-1.21.3-imported ]; then
            bash scripts/import_upstream_1_21_3.sh
            touch .port-1.21.3-imported
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main/java src/main/resources .port-1.21.3-imported
            git commit -m "Import upstream 1.21.3 renderer migration"
            git push origin HEAD:26.1.2-port
          fi

      - name: Apply verified mechanical 26.1.2 renames
        run: |
          python3 scripts/port_26_1_mechanical.py
          if ! git diff --quiet -- src/main/java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main/java
            git commit -m "Apply verified Minecraft 26.1.2 class renames"
            git push origin HEAD:26.1.2-port
          fi

      - name: Probe Minecraft and Fabric 26.1.2 APIs
        run: |
          ./gradlew printClasspath > /tmp/classpath.txt
          python3 - <<'PY'
          import os, re, subprocess
          text = open('/tmp/classpath.txt', errors='ignore').read()
          jars = [p for p in re.findall(r'"([^"\n]+\.jar)"', text) if os.path.exists(p)]
          mc = None
          for jar in jars:
              try:
                  listing = subprocess.check_output(['jar','tf',jar], text=True, stderr=subprocess.DEVNULL)
              except Exception:
                  continue
              if 'net/minecraft/world/item/Item.class' in listing:
                  mc = jar
                  break
          print('MINECRAFT_JAR=', mc)
          if not mc:
              raise SystemExit(0)
          classes = [
              'net.minecraft.world.item.Item',
              'net.minecraft.world.InteractionResult',
              'net.minecraft.server.level.Ticket',
              'net.minecraft.server.level.TicketType',
              'net.minecraft.server.level.DistanceManager',
              'net.minecraft.server.level.ChunkTaskDispatcher',
              'net.minecraft.server.level.ThrottlingChunkTaskDispatcher',
              'net.minecraft.server.level.ServerLevel',
              'net.minecraft.server.network.ServerGamePacketListenerImpl',
              'net.minecraft.world.level.chunk.ChunkGenerator',
              'net.minecraft.client.gui.screens.Screen',
              'net.minecraft.client.gui.GuiGraphicsExtractor',
              'net.minecraft.client.renderer.Lightmap',
              'net.minecraft.client.renderer.LevelRenderer',
              'net.minecraft.client.renderer.GameRenderer',
              'com.mojang.blaze3d.opengl.GlProgram',
          ]
          for cls in classes:
              print('\n##### JAVAP', cls, '#####')
              subprocess.run(['javap','-classpath',mc,'-p',cls], check=False)
          print('\n##### RELEVANT MINECRAFT CLASSES #####')
          listing = subprocess.check_output(['jar','tf',mc], text=True)
          pat = re.compile(r'(ChunkProgress|GuiGraphics|InteractionResult|Weighted(List|Random)|GenerationStep|Carv|Ticket(Type)?\.class|DistanceManager|ChunkTask|SavedDataStorage|Relative\.class|DimensionTransition|Teleport|Lightmap|LightTexture|FogParameters|VertexBuffer|GraphicsStatus|CoreShaders|ShaderProgram|CompiledShader|GlProgram|ReceivingLevelScreen|LoadingScreen|RenderPipeline)')
          for line in listing.splitlines():
              if pat.search(line):
                  print(line)
          print('\n##### RELEVANT FABRIC CLASSES #####')
          fpat = re.compile(r'(ClientCommands|FabricCreativeModeTab|BlockRender|RenderLayer|FabricBlock|CreativeTab)')
          for jar in jars:
              try:
                  listing = subprocess.check_output(['jar','tf',jar], text=True, stderr=subprocess.DEVNULL)
              except Exception:
                  continue
              matches = [x for x in listing.splitlines() if fpat.search(x)]
              if matches:
                  print('===', jar, '===')
                  print('\n'.join(matches[:300]))
          PY

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/libs/**
            build/reports/**
          if-no-files-found: ignore
