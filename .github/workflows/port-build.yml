name: Port Build

on:
  push:
    branches:
      - 26.1.2-port
  pull_request:
    branches:
      - 1.21
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: 26.1.2-port

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply verified mechanical 26.1.2 renames
        run: |
          python3 scripts/port_26_1_mechanical.py
          if ! git diff --quiet -- src/main/java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main/java
            git commit -m "Apply verified Minecraft 26.1.2 class renames"
            git push origin HEAD:26.1.2-port
          fi

      - name: Inspect remaining 26.1.2 APIs
        run: |
          ./gradlew printClasspath > /tmp/classpath.txt
          python3 - <<'PY'
          import os, re, subprocess
          text = open('/tmp/classpath.txt', errors='ignore').read()
          jars = re.findall(r'"([^"\n]+\.jar)"', text)
          needles = re.compile(r'(ChunkProgress|GuiGraphics|InteractionResult|Weighted|Carv|BlockRenderLayer|CreativeModeTab|ItemGroup|BlockSettings|ClientCommand|ChunkTask|PriorityQueue|ProcessorMailbox|Mailbox|DimensionData|DataStorage|RelativeMovement|Relative|EndDragon|DragonFight|LightTexture|Lightmap|ReceivingLevel|VertexBuffer|GlStateManager|ShaderInstance|ShaderProgram|Uniform|Program\.class)')
          for jar in jars:
              if not os.path.exists(jar):
                  continue
              try:
                  listing = subprocess.check_output(['jar','tf',jar], text=True, stderr=subprocess.DEVNULL)
              except Exception:
                  continue
              matches = [line for line in listing.splitlines() if needles.search(line)]
              if matches:
                  print('\n===', jar, '===')
                  print('\n'.join(matches[:700]))
          PY

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/libs/**
            build/reports/**
          if-no-files-found: ignore
