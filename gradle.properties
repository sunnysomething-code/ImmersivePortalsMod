# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G

org.gradle.parallel=false
org.gradle.configuration-cache=false

# Mod Properties
# don't forget to change changelog.md after bumping version
mod_version=6.0.6
maven_group=qouteall
archives_base_name=immersive-portals

# 26.1.2-compatible dependencies
modmenu_version=18.0.0-beta.1
cloth_config_version=26.1.154

# Rendering compatibility is temporarily excluded while the core 26.1.2 port compiles.
sodium_path=maven.modrinth:sodium:mc26.1.2-0.8.12-fabric
iris_path=maven.modrinth:iris:1.10.8+26.1-fabric
gravity_changer_version=cd4e3377
dimlib_version=v1.1.0-mc1.21.1
enable_sodium=false
enable_iris=false
enable_pehkui=false
enable_gravity_changer=false
enable_test_mod=false
enable_geckolib=false

# don't forget to update this if branch changes
git_branch=26.1.2-port

# Fabric 26.1.2
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_version=0.155.2+26.1.2
